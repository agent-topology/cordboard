[project]
name = "cord-runtime"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.11",
  "langsmith==0.12.4",
  "redact-secret==0.1.0b1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-exporter-otlp-proto-http==1.39.1",
  "protobuf==6.33.6",
  "requests==2.34.2",
  "pyyaml==6.0.3",
  "langchain-core==1.6.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
proxy = ["litellm[proxy]==1.87.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cord_runtime"]

[project.scripts]
archive-escalations = "cord_runtime.archive_query:main"
archive-check = "cord_runtime.archive_check:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "collector: requires the pinned Collector and redact-secret CLI binaries",
  "aegra: requires Docker Postgres and the locked aegra environment",
]
