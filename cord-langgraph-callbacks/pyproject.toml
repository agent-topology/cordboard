[project]
name = "cord-langgraph-callbacks"
version = "0.0.1"
description = "Cordboard Run/Step span producer for LangGraph, installable inside an entity process without cord-runtime's exact pins (#89)."
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-api>=1.20,<2",
  "langchain-core>=0.3,<2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cord_langgraph_callbacks"]
